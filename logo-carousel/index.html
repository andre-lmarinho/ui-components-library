<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-content">
      <h1>Trusted by leading companies</h1>
      <div class="logo-carousel">
        <div class="logo-carousel__viewport">
          <div class="logo-carousel__track">
            <div class="logo-carousel__slide">
              <img src="https://svgl.app/library/google.svg" alt="Google" />
            </div>
            <div class="logo-carousel__slide">
              <img src="https://svgl.app/library/github-dark.svg" alt="GitHub" />
            </div>
            <div class="logo-carousel__slide">
              <img src="https://svgl.app/library/slack.svg" alt="Slack" />
            </div>
            <div class="logo-carousel__slide">
              <img src="https://svgl.app/library/figma.svg" alt="Figma" />
            </div>
            <div class="logo-carousel__slide">
              <img src="https://svgl.app/library/vercel-dark.svg" alt="Vercel" />
            </div>
            <div class="logo-carousel__slide">
              <img src="https://svgl.app/library/stripe.svg" alt="Stripe" />
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
