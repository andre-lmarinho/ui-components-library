<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Field Challenge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-content">
      <section class="password-card" aria-labelledby="password-heading">
        <header class="password-card__header">
          <h1 id="password-heading">Enter your password</h1>
          <button type="button" class="account-info">
            <img
              class="account-info__avatar"
              src="https://i.pravatar.cc/64?img=47"
              alt="Sarah Bills"
              width="48"
              height="48"
            />
            <div class="account-info__details">
              <span class="account-info__type">Business account</span>
              <span class="account-info__name">Sarah Bills</span>
            </div>
          </button>
        </header>
        <form class="password-form" autocomplete="on">
          <div class="form-field">
            <label class="form-label" for="password-input">Password</label>
            <div class="password-input">
              <span class="password-input__icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
              </span>
              <input
                class="password-input__field"
                type="password"
                id="password-input"
                name="current-password"
                placeholder="Enter your password"
                required
              />
              <button
                class="password-visibility"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
                data-visibility="hidden"
              >
                <svg class="password-visibility__icon password-visibility__icon--hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.46 18.46 0 0 1-2.16 3.19"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                  <path d="M12 9a3 3 0 0 0-3 3"></path>
                </svg>
                <svg class="password-visibility__icon password-visibility__icon--visible" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-actions">
            <label class="stay-signed-in" for="stay-signed-in-toggle">
              <input type="checkbox" id="stay-signed-in-toggle" name="stay-signed-in" />
              <span class="stay-signed-in__control" aria-hidden="true">
                <span class="stay-signed-in__thumb"></span>
              </span>
              <span class="stay-signed-in__label">Stay signed in</span>
            </label>
            <button class="primary-button" type="submit">Continue</button>
          </div>
          <button class="reset-password" type="button">Reset password</button>
        </form>
      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
